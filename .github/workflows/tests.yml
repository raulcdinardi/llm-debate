name: CPU compatibility
on:
  push:
    branches: [main, 'codex/main-consolidation-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . -r requirements-ci.txt
      - run: python -m pytest -q -ra tests/unit
      - run: python scripts/verify_migration.py
