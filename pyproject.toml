[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-local-rl"
version = "0.1.0"
description = "Local-only RL scaffolding for vLLM sampling and LoRA training."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
integration = [
    "pytest>=8.0",
    "torch",
    "transformers",
    "peft",
    "vllm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local model weights and optional heavy dependencies",
]
